
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17251f">
<title>운명의 서재 | AI 정통 사주</title>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js"></script>

<style>
:root {
  --green:#244b3b;
  --green2:#356b51;
  --gold:#c5a66b;
  --paper:#faf8f2;
  --ink:#252a27;
  --muted:#737b75;
  --line:#e4e5df;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#f1f3ef;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  line-height:1.65;
}
header {
  background:linear-gradient(135deg,#142b22,#315743);
  color:#fff;
  padding:30px 18px 26px;
  text-align:center;
}
header .brand {
  color:#d7bd85;
  font-size:13px;
  letter-spacing:4px;
  margin-bottom:7px;
}
header h1 {
  margin:0;
  font-family:"Noto Serif KR",serif;
  font-size:30px;
  letter-spacing:2px;
}
header p {
  margin:9px 0 0;
  color:#e2e8e1;
  font-size:13px;
}
.container {
  width:min(900px,100%);
  margin:22px auto;
  padding:0 14px 45px;
}
.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(25,45,32,.04);
}
.panel h2 {
  margin:0 0 15px;
  color:var(--green);
  font-size:19px;
}
.panel h2 small {
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:400;
  margin-top:3px;
}
.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.field {min-width:0}
.field.full {grid-column:1/-1}
label {
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:#47534b;
}
input,select {
  width:100%;
  height:46px;
  border:1px solid #d9ded8;
  border-radius:9px;
  background:#fff;
  padding:0 11px;
  font-size:15px;
  color:var(--ink);
}
input:focus,select:focus {
  outline:2px solid #b9d0c0;
  border-color:var(--green2);
}
.hint {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}
button {
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  padding:13px 15px;
  min-height:45px;
}
button:disabled {opacity:.55;cursor:wait}
.primary {
  background:var(--green);
  color:#fff;
  width:100%;
  margin-top:18px;
  font-size:16px;
}
.secondary {
  background:#edf2ed;
  color:var(--green);
}
.gold {
  background:#f4eddf;
  color:#715a2e;
}
.button-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:14px;
}
.button-grid button {width:100%}
.status {
  display:none;
  margin:14px 0;
  padding:12px;
  border-radius:9px;
  background:#f2f5f1;
  color:var(--green);
  font-size:13px;
  white-space:pre-wrap;
}
.status.error {
  background:#fff0ed;
  color:#a23c2c;
}
#resultSection {display:none}
.result-title {
  color:var(--green);
  font-size:23px;
  margin:0 0 5px;
}
.result-subtitle {
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
}
.pillar-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:14px 0;
}
.pillar {
  border:1px solid #e3e7e1;
  border-radius:10px;
  text-align:center;
  overflow:hidden;
  background:#fbfcfa;
}
.pillar .name {
  background:#edf2ed;
  color:var(--green);
  padding:6px 2px;
  font-size:12px;
  font-weight:700;
}
.pillar .ganji {
  padding:13px 2px;
  font-family:serif;
  font-size:24px;
  font-weight:700;
  letter-spacing:2px;
}
.pillar .detail {
  font-size:10px;
  color:var(--muted);
  padding:0 2px 8px;
  min-height:28px;
}
.info-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.info-item {
  background:#f7f8f5;
  border-radius:8px;
  padding:10px;
  font-size:12px;
}
.info-item b {
  display:block;
  color:var(--green);
  margin-bottom:3px;
}
.data-table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
  margin-top:10px;
}
.data-table th,.data-table td {
  border:1px solid #e4e7e1;
  padding:8px 5px;
  text-align:center;
}
.data-table th {
  background:#edf2ed;
  color:var(--green);
}
.data-table td {background:#fff}
.section-title {
  color:var(--green);
  font-size:18px;
  margin:23px 0 9px;
  padding-left:10px;
  border-left:3px solid var(--gold);
}
#interpretation {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:15px;
  line-height:1.95;
}
#interpretation h3 {color:var(--green)}
.ai-content {
  border-top:1px solid var(--line);
  padding-top:18px;
  margin-top:18px;
}
.result-actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:16px;
}
.result-actions button {width:100%}
.notice {
  color:#7b817b;
  font-size:11px;
  margin-top:18px;
}
footer {
  text-align:center;
  color:#89918a;
  font-size:11px;
  padding:15px;
}
@media(max-width:520px) {
  header {padding:25px 14px}
  header h1 {font-size:26px}
  .panel {padding:16px}
  .form-grid {gap:11px}
  .pillar .ganji {font-size:21px}
  #interpretation {font-size:14px}
}
@media print {
  body {background:#fff}
  header,.input-panel,.action-panel,.result-actions,footer {display:none!important}
  .container {width:100%;margin:0;padding:0}
  .panel {border:0;box-shadow:none;padding:0;margin:0}
  #resultSection {display:block!important}
  #interpretation {font-size:12pt;line-height:1.8}
  .pillar-grid {break-inside:avoid}
  .section-title {break-after:avoid}
}
</style>
</head>

<body>
<header>
  <div class="brand">MY FATE · MY STORY</div>
  <h1>운명의 서재</h1>
  <p>나의 사주를 읽고, 삶의 흐름을 살펴보다</p>
</header>

<main class="container">

  <section class="panel input-panel">
    <h2>사주 정보 입력
      <small>정확한 생년월일과 출생 시간을 입력해 주세요.</small>
    </h2>

    <div class="form-grid">
      <div class="field full">
        <label for="personName">이름 또는 호칭</label>
        <input id="personName" type="text" placeholder="이름을 입력하세요">
      </div>

      <div class="field">
        <label for="gender">성별</label>
        <select id="gender">
          <option value="female">여성</option>
          <option value="male">남성</option>
        </select>
      </div>

      <div class="field">
        <label for="calendarType">달력 구분</label>
        <select id="calendarType">
          <option value="solar">양력</option>
          <option value="lunar">음력</option>
        </select>
      </div>

      <div class="field">
        <label for="birthYear">출생 연도</label>
        <input id="birthYear" type="number" inputmode="numeric" placeholder="예: 1970">
      </div>

      <div class="field">
        <label for="birthMonth">출생 월</label>
        <select id="birthMonth"></select>
      </div>

      <div class="field">
        <label for="birthDay">출생 일</label>
        <select id="birthDay"></select>
      </div>

      <div class="field" id="leapField" style="display:none">
        <label for="leapMonth">음력 윤달 여부</label>
        <select id="leapMonth">
          <option value="no">평달</option>
          <option value="yes">윤달</option>
        </select>
      </div>

      <div class="field">
        <label for="birthHour">출생 시간</label>
        <select id="birthHour">
          <option value="-1">모름</option>
          <option value="0">자시 (23:00~00:59)</option>
          <option value="1">축시 (01:00~02:59)</option>
          <option value="3">인시 (03:00~04:59)</option>
          <option value="5">묘시 (05:00~06:59)</option>
          <option value="7">진시 (07:00~08:59)</option>
          <option value="9">사시 (09:00~10:59)</option>
          <option value="11">오시 (11:00~12:59)</option>
          <option value="13">미시 (13:00~14:59)</option>
          <option value="15">신시 (15:00~16:59)</option>
          <option value="17">유시 (17:00~18:59)</option>
          <option value="19">술시 (19:00~20:59)</option>
          <option value="21">해시 (21:00~22:59)</option>
        </select>
      </div>

      <div class="field">
        <label for="maritalStatus">혼인 상태</label>
        <select id="maritalStatus">
          <option value="미혼">미혼</option>
          <option value="연애 중">연애 중</option>
          <option value="기혼">기혼</option>
          <option value="이혼">이혼</option>
          <option value="사별">사별</option>
        </select>
      </div>

      <div class="field full">
        <label for="birthPlace">출생 지역 (선택)</label>
        <input id="birthPlace" type="text" placeholder="예: 서울, 부산, 인천">
        <div class="hint">출생 지역은 참고 정보로 AI 풀이에 전달됩니다.</div>
      </div>
    </div>

    <button class="primary" id="calculateBtn" onclick="calculateSaju()">
      사주 원국 확인하기
    </button>
    <div id="status" class="status"></div>
  </section>

  <section class="panel" id="chartSection" style="display:none">
    <h2>나의 사주 원국</h2>
    <div id="birthSummary"></div>
    <div class="pillar-grid" id="pillarGrid"></div>
    <div class="info-list" id="pillarInfo"></div>

    <h3 class="section-title">대운 흐름</h3>
    <div id="daewoonView"></div>

    <h3 class="section-title">향후 10년 세운</h3>
    <div id="sewoonView"></div>

    <h3 class="section-title">합·충·형·파·해 분석 자료</h3>
    <div id="relationView"></div>
  </section>

  <section class="panel action-panel" id="actionSection" style="display:none">
    <h2>AI 사주 심층 풀이
      <small>원하는 분석 항목을 선택하세요.</small>
    </h2>

    <div class="button-grid">
      <button class="secondary" onclick="requestInterpretation('full')">종합 사주 분석</button>
      <button class="secondary" onclick="requestInterpretation('today')">오늘의 운세</button>
      <button class="gold" onclick="requestInterpretation('wealth')">재물·직업운</button>
      <button class="gold" onclick="requestInterpretation('love')">애정·결혼운</button>
      <button class="secondary" onclick="requestInterpretation('year2027')">2027년 운세</button>
    </div>
    <div id="aiStatus" class="status"></div>
  </section>

  <section class="panel" id="resultSection">
    <h2 class="result-title" id="resultTitle">사주 분석 결과</h2>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="ai-content" id="interpretation"></div>

    <div class="result-actions">
      <button class="secondary" onclick="printReport()">인쇄하기</button>
      <button class="gold" onclick="printReport()">PDF 저장하기</button>
    </div>
    <div class="notice">
      본 결과는 전통 명리학을 바탕으로 한 참고용 해석입니다.
      중요한 의료·법률·금융 결정은 전문적인 상담과 함께 판단하시기 바랍니다.
    </div>
  </section>

</main>

<footer>운명의 서재 · AI 명리학 해석 서비스</footer>

<script>
"use strict";

let currentChart = null;
let currentMode = "full";

const $ = id => document.getElementById(id);

const STEMS = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const BRANCHES = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

const STEM_ELEMENT = {
  "甲":"목","乙":"목","丙":"화","丁":"화","戊":"토",
  "己":"토","庚":"금","辛":"금","壬":"수","癸":"수"
};

const BRANCH_ELEMENT = {
  "子":"수","丑":"토","寅":"목","卯":"목","辰":"토","巳":"화",
  "午":"화","未":"토","申":"금","酉":"금","戌":"토","亥":"수"
};

const RELATIONS = {
  육합: [["子","丑"],["寅","亥"],["卯","戌"],["辰","酉"],["巳","申"],["午","未"]],
  충: [["子","午"],["丑","未"],["寅","申"],["卯","酉"],["辰","戌"],["巳","亥"]],
  파: [["子","酉"],["丑","辰"],["寅","亥"],["卯","午"],["巳","申"],["未","戌"]],
  해: [["子","未"],["丑","午"],["寅","巳"],["卯","辰"],["申","亥"],["酉","戌"]],
  천간합: [["甲","己"],["乙","庚"],["丙","辛"],["丁","壬"],["戊","癸"]]
};

const THREE_COMBINATIONS = [
  {name:"신자진 삼합",items:["申","子","辰"]},
  {name:"해묘미 삼합",items:["亥","卯","未"]},
  {name:"인오술 삼합",items:["寅","午","戌"]},
  {name:"사유축 삼합",items:["巳","酉","丑"]}
];

const SEASON_COMBINATIONS = [
  {name:"인묘진 방합",items:["寅","卯","辰"]},
  {name:"사오미 방합",items:["巳","午","未"]},
  {name:"신유술 방합",items:["申","酉","戌"]},
  {name:"해자축 방합",items:["亥","子","丑"]}
];

function showStatus(message, isError=false, target="status") {
  const el = $(target);
  el.style.display = "block";
  el.className = isError ? "status error" : "status";
  el.textContent = message;
}

function hideStatus(target="status") {
  $(target).style.display = "none";
}

function initDateSelectors() {
  for (let i=1;i<=12;i++) {
    $("birthMonth").add(new Option(i+"월",i));
  }
  updateDays();
}

function updateDays() {
  const month = Number($("birthMonth").value || 1);
  const year = Number($("birthYear").value || 2000);
  const calendar = $("calendarType").value;
  let max = 30;

  if (calendar === "solar") {
    max = new Date(year,month,0).getDate();
  } else {
    max = 30;
  }

  const old = Number($("birthDay").value || 1);
  $("birthDay").innerHTML = "";
  for (let i=1;i<=max;i++) {
    $("birthDay").add(new Option(i+"일",i));
  }
  $("birthDay").value = String(Math.min(old,max));
}

$("birthMonth").addEventListener("change",updateDays);
$("birthYear").addEventListener("change",updateDays);
$("calendarType").addEventListener("change",()=>{
  $("leapField").style.display =
    $("calendarType").value === "lunar" ? "block" : "none";
  updateDays();
});

function safeCall(obj, method, fallback="") {
  try {
    if (obj && typeof obj[method] === "function") {
      const value = obj[method]();
      return value == null ? fallback : value;
    }
  } catch(e) {}
  return fallback;
}

function toArray(value) {
  if (Array.isArray(value)) return value;
  if (value == null || value === "") return [];
  return [value];
}

function validateInput() {
  const year = Number($("birthYear").value);
  const month = Number($("birthMonth").value);
  const day = Number($("birthDay").value);

  if (!year || year < 1900 || year > 2100) {
    throw new Error("출생 연도를 1900년부터 2100년 사이로 입력해 주세요.");
  }
  if (!month || month < 1 || month > 12 || !day || day < 1 || day > 30) {
    throw new Error("생년월일을 올바르게 입력해 주세요.");
  }

  if ($("calendarType").value === "solar") {
    const date = new Date(year,month-1,day);
    if (
      date.getFullYear() !== year ||
      date.getMonth() !== month-1 ||
      date.getDate() !== day
    ) {
      throw new Error("실제로 존재하는 양력 날짜를 입력해 주세요.");
    }
  }

  return {year,month,day};
}

function makeBirthDate(input) {
  const {year,month,day} = input;
  const hourValue = Number($("birthHour").value);
  const hasBirthHour = hourValue >= 0;
  const hour = hasBirthHour ? hourValue : 12;
  let solar;
  let lunar;

  if ($("calendarType").value === "solar") {
    solar = Solar.fromYmdHms(year,month,day,hour,0,0);
    lunar = solar.getLunar();
  } else {
    const isLeap = $("leapMonth").value === "yes";
    const lunarMonth = isLeap ? -month : month;
    lunar = Lunar.fromYmd(year,lunarMonth,day);
    solar = lunar.getSolar();
  }

  if (!solar || !lunar) {
    throw new Error("생년월일을 변환하지 못했습니다. 입력 내용을 확인해 주세요.");
  }

  return {solar,lunar,hasBirthHour,hour};
}

function getPillars(eight, hasBirthHour) {
  const result = {
    year: safeCall(eight,"getYear"),
    month: safeCall(eight,"getMonth"),
    day: safeCall(eight,"getDay"),
    time: hasBirthHour ? safeCall(eight,"getTime") : "미상"
  };

  ["year","month","day"].forEach(key=>{
    if (!result[key]) throw new Error("사주 원국 계산에 실패했습니다.");
  });

  return result;
}

function getPillarAnalysis(eight, hasBirthHour) {
  const rows = [
    {key:"year",name:"년주",stem:"getYearGan",branch:"getYearZhi",hidden:"getYearHideGan",stemGod:"getYearShiShenGan",branchGod:"getYearShiShenZhi"},
    {key:"month",name:"월주",stem:"getMonthGan",branch:"getMonthZhi",hidden:"getMonthHideGan",stemGod:"getMonthShiShenGan",branchGod:"getMonthShiShenZhi"},
    {key:"day",name:"일주",stem:"getDayGan",branch:"getDayZhi",hidden:"getDayHideGan",stemGod:"getDayShiShenGan",branchGod:"getDayShiShenZhi"},
    {key:"time",name:"시주",stem:"getTimeGan",branch:"getTimeZhi",hidden:"getTimeHideGan",stemGod:"getTimeShiShenGan",branchGod:"getTimeShiShenZhi"}
  ];

  return rows.map(row=>{
    if (row.key === "time" && !hasBirthHour) {
      return {
        pillar:row.name,
        stem:"미상",
        branch:"미상",
        hiddenStems:[],
        stemTenGod:"출생 시간 미상",
        branchTenGod:"출생 시간 미상"
      };
    }

    return {
      pillar:row.name,
      stem:safeCall(eight,row.stem),
      branch:safeCall(eight,row.branch),
      hiddenStems:toArray(safeCall(eight,row.hidden,[])),
      stemTenGod:safeCall(eight,row.stemGod),
      branchTenGod:safeCall(eight,row.branchGod)
    };
  });
}

function getDaewoon(eight, gender, birthYear) {
  const genderCode = gender === "male" ? 1 : 0;

  try {
    const yun = eight.getYun(genderCode,2);
    if (!yun) throw new Error("대운 정보 없음");

    const daYunList = yun.getDaYun(10) || [];
    const startYear = safeCall(yun,"getStartYear");
    const startMonth = safeCall(yun,"getStartMonth");
    const startDay = safeCall(yun,"getStartDay");

    const list = daYunList.map(item=>{
      const startAge = safeCall(item,"getStartAge");
      const endAge = safeCall(item,"getEndAge");
      const start = safeCall(item,"getStartYear");
      const end = safeCall(item,"getEndYear");

      let annual = [];
      try {
        const liuNian = item.getLiuNian(10) || [];
        annual = liuNian.map(ln=>({
          year:safeCall(ln,"getYear"),
          ganZhi:safeCall(ln,"get干支") || safeCall(ln,"getGanZhi"),
          age:safeCall(ln,"getAge")
        }));
      } catch(e) {}

      return {
        ganZhi:safeCall(item,"getGanZhi"),
        startAge,
        endAge,
        startYear:start,
        endYear:end,
        annual
      };
    });

    return {
      available:list.length>0,
      direction:safeCall(yun,"getDirection"),
      startAge:safeCall(yun,"getStartYear"),
      startDate:[startYear,startMonth,startDay].filter(v=>v!=="").join("-"),
      list
    };
  } catch(e) {
    return {
      available:false,
      direction:"확인 필요",
      startAge:"",
      startDate:"",
      list:[],
      note:"대운 계산 정보를 가져오지 못했습니다."
    };
  }
}

function getSewoon(birthYear) {
  const thisYear = new Date().getFullYear();
  const list = [];

  for (let year=thisYear;year<thisYear+10;year++) {
    try {
      const solar = Solar.fromYmd(year,7,1);
      const lunar = solar.getLunar();
      const eight = lunar.getEightChar();
      const ganZhi = safeCall(eight,"getYear");

      list.push({
        year,
        ganZhi,
        age:year-birthYear+1
      });
    } catch(e) {
      list.push({year,ganZhi:"계산 불가",age:year-birthYear+1});
    }
  }
  return list;
}

function getPillarParts(pillar) {
  if (!pillar || pillar === "미상") return ["",""];
  return [pillar.charAt(0),pillar.charAt(1)];
}

function pairMatch(pair,a,b) {
  return pair.includes(a) && pair.includes(b);
}

function findPairRelation(type, pairs, a, b) {
  if (!a || !b || a===b) return false;
  return pairs.some(pair=>pairMatch(pair,a,b));
}

function analyzeRelations(pillars, daewoon, sewoon) {
  const natal = [];
  const sources = [];

  ["year","month","day","time"].forEach(key=>{
    const value = pillars[key];
    if (!value || value==="미상") return;
    const [stem,branch] = getPillarParts(value);
    sources.push({name:key==="year"?"년주":key==="month"?"월주":key==="day"?"일주":"시주",stem,branch});
  });

  const results = [];
  const seen = new Set();

  function add(type,from,to,detail) {
    const key = [type,from,to,detail].join("|");
    if (seen.has(key)) return;
    seen.add(key);
    results.push({type,from,to,detail});
  }

  function compareBranch(sourceA,sourceB) {
    const a=sourceA.branch,b=sourceB.branch;
    if (!a || !b) return;

    Object.keys(RELATIONS).filter(x=>x!=="천간합").forEach(type=>{
      if (findPairRelation(type,RELATIONS[type],a,b)) {
        add(type,sourceA.name,sourceB.name,a+"-"+b);
      }
    });

    if (a===b && ["辰","午","酉","亥"].includes(a)) {
      add("자형",sourceA.name,sourceB.name,a+"-"+b);
    }

    if ((a==="子"&&b==="卯")||(a==="卯"&&b==="子")) {
      add("상형",sourceA.name,sourceB.name,a+"-"+b);
    }
  }

  for (let i=0;i<sources.length;i++) {
    for (let j=i+1;j<sources.length;j++) {
      compareBranch(sources[i],sources[j]);

      const a=sources[i].stem,b=sources[j].stem;
      if (findPairRelation("천간합",RELATIONS.천간합,a,b)) {
        add("천간합",sources[i].name,sources[j].name,a+"-"+b);
      }
    }
  }

  function checkGroup(sourceList, group, type) {
    const present = group.items.filter(branch=>
      sourceList.some(s=>s.branch===branch)
    );
    if (present.length===group.items.length) {
      add(type,sourceList.map(s=>s.name).join("+"),group.name,present.join(""));
    } else if (present.length===2) {
      add(type==="삼합"?"삼합 일부":"방합 일부",
        sourceList.map(s=>s.name).join("+"),group.name,present.join(""));
    }
  }

  THREE_COMBINATIONS.forEach(group=>checkGroup(sources,group,"삼합"));
  SEASON_COMBINATIONS.forEach(group=>checkGroup(sources,group,"방합"));

  const punishmentGroups = [
    {name:"인사신 삼형",items:["寅","巳","申"]},
    {name:"축술미 삼형",items:["丑","戌","未"]}
  ];

  punishmentGroups.forEach(group=>{
    const present=group.items.filter(x=>sources.some(s=>s.branch===x));
    if (present.length===3) add("삼형", "원국",group.name,present.join(""));
    else if (present.length===2) add("삼형 일부","원국",group.name,present.join(""));
  });

  const luckSources=[];

  if (daewoon && Array.isArray(daewoon.list)) {
    daewoon.list.forEach((item,index)=>{
      if (!item.ganZhi || item.ganZhi.length<2) return;
      luckSources.push({
        name:"대운 "+(index+1)+" ("+item.ganZhi+")",
        stem:item.ganZhi.charAt(0),
        branch:item.ganZhi.charAt(1)
      });
    });
  }

  (sewoon||[]).forEach(item=>{
    if (!item.ganZhi || item.ganZhi.length<2) return;
    luckSources.push({
      name:"세운 "+item.year+"년 ("+item.ganZhi+")",
      stem:item.ganZhi.charAt(0),
      branch:item.ganZhi.charAt(1)
    });
  });

  luckSources.forEach(luck=>{
    sources.forEach(base=>{
      compareBranch(base,luck);
      if (findPairRelation("천간합",RELATIONS.천간합,base.stem,luck.stem)) {
        add("천간합",base.name,luck.name,base.stem+"-"+luck.stem);
      }
    });
  });

  return {
    natalRelations:results.filter(x=>
      !x.from.startsWith("대운") && !x.from.startsWith("세운") &&
      !x.to.startsWith("대운") && !x.to.startsWith("세운")
    ),
    luckRelations:results.filter(x=>
      x.from.startsWith("대운") || x.from.startsWith("세운") ||
      x.to.startsWith("대운") || x.to.startsWith("세운")
    ),
    note:"합·충·형·파·해는 관계의 존재를 표시한 참고 자료입니다. 실제 작용과 길흉은 원국 전체, 계절, 오행의 세력, 대운·세운을 함께 살펴 판단해야 합니다."
  };
}

function renderPillars(pillars, analysis) {
  const labels=["년주","월주","일주","시주"];
  const keys=["year","month","day","time"];

  $("pillarGrid").innerHTML=keys.map((key,i)=>{
    const value=pillars[key] || "미상";
    const parts=getPillarParts(value);
    const detail=analysis[i] ?
      "천간 "+(analysis[i].stemTenGod||"-")+" · 지지 "+(analysis[i].branchTenGod||"-") : "";
    return `
      <div class="pillar">
        <div class="name">${labels[i]}</div>
        <div class="ganji">${parts[0]||"?"}<br>${parts[1]||"?"}</div>
        <div class="detail">${detail}</div>
      </div>`;
  }).join("");

  $("pillarInfo").innerHTML=analysis.map(item=>`
    <div class="info-item">
      <b>${item.pillar}</b>
      천간: ${item.stem||"-"} (${item.stemTenGod||"-"})<br>
      지지: ${item.branch||"-"} (${item.branchTenGod||"-"})<br>
      지장간: ${item.hiddenStems.length ? item.hiddenStems.join(", ") : "-"}
    </div>
  `).join("");
}

    return;
  }

  let html="<table class='data-table'><thead><tr><th>순서</th><th>대운</th><th>시작 나이</th><th>종료 나이</th><th>기간</th></tr></thead><tbody>";

  data.list.forEach((item,index)=>{

      <td>${item.startAge||"-"}</td>

function renderRelations(data) {
  const all=[...(data.natalRelations||[]),...(data.luckRelations||[])];

  if (!all.length) {
    $("relationView").innerHTML="<p class='hint'>현재 표시할 합·충·형·파·해 관계가 확인되지 않았습니다. 관계가 없다는 뜻은 아니며, 적용 범위와 계산 조건에 따라 달라질 수 있습니다.</p>";
  } else {
    $("relationView").innerHTML=`
      <table class="data-table">
        <thead><tr><th>관계</th><th>위치</th><th>대상</th><th>구성</th></tr></thead>
        <tbody>
          ${all.map(item=>`
            <tr>
              <td>${item.type}</td>
              <td>${item.from}</td>
              <td>${item.to}</td>
              <td>${item.detail}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>`;
  }

  $("relationView").innerHTML += `<p class="hint">${data.note}</p>`;
}

function getElementSummary(pillars) {
  const counts={목:0,화:0,토:0,금:0,수:0};
  Object.values(pillars).forEach(value=>{
    if (!value || value==="미상") return;
    const [stem,branch]=getPillarParts(value);
    if (STEM_ELEMENT[stem]) counts[STEM_ELEMENT[stem]]++;
    if (BRANCH_ELEMENT[branch]) counts[BRANCH_ELEMENT[branch]]++;
  });
  return counts;
}

function buildChart() {
  if (!window.Solar || !window.Lunar) {
    throw new Error("사주 계산 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 다시 시도해 주세요.");
  }

  const input=validateInput();
  const birth=makeBirthDate(input);
  const eight=birth.lunar.getEightChar();

  if (!eight) throw new Error("사주 원국을 계산하지 못했습니다.");

  const pillars=getPillars(eight,birth.hasBirthHour);
  const gender=$("gender").value;
  const analysis=getPillarAnalysis(eight,birth.hasBirthHour);
  const daewoon=getDaewoon(eight,gender,birth.solar.getYear());
  const sewoon=getSewoon(birth.solar.getYear());
  const relationAnalysis=analyzeRelations(pillars,daewoon,sewoon);

  const solarDate=[
    birth.solar.getYear(),
    String(birth.solar.getMonth()).padStart(2,"0"),
    String(birth.solar.getDay()).padStart(2,"0")
  ].join("-");

  const lunarDate=[
    birth.lunar.getYear(),
    birth.lunar.getMonth(),
    birth.lunar.getDay()
  ].join("-");

  const zodiac=safeCall(birth.lunar,"getYearShengXiao");

  return {
    name:$("personName").value.trim() || "이름 미입력",
    gender:gender==="male"?"남성":"여성",
    genderCode:gender,
    maritalStatus:$("maritalStatus").value,
    calendar:$("calendarType").value,
    solarDate,
    lunarDate,
    zodiac,
    pillars,
    pillarAnalysis:analysis,
    relationAnalysis,
    place:$("birthPlace").value.trim(),
    birthHour:birth.hasBirthHour ? $("birthHour").selectedOptions[0].text : "모름",
    hasBirthHour:birth.hasBirthHour,
    daewoon,
    sewoon,
    elementCount:getElementSummary(pillars),
    calculationNotes:[
      birth.hasBirthHour ? "" : "출생 시간을 모르는 경우 시주는 미상으로 처리했습니다. 대운 계산은 출생 시간의 불확실성에 영향을 받을 수 있습니다.",
      $("calendarType").value==="lunar" && $("leapMonth").value==="yes" ? "음력 윤달로 입력했습니다." : ""
    ].filter(Boolean)
  };
}

function calculateSaju() {
  hideStatus();
  $("calculateBtn").disabled=true;
  $("calculateBtn").textContent="사주 계산 중...";

  try {
    currentChart=buildChart();

    $("birthSummary").innerHTML=`
      <div class="info-list">
        <div class="info-item"><b>이름</b>${currentChart.name}</div>
        <div class="info-item"><b>성별 / 혼인 상태</b>${currentChart.gender} / ${currentChart.maritalStatus}</div>
        <div class="info-item"><b>양력 생일</b>${currentChart.solarDate}</div>
        <div class="info-item"><b>음력 생일</b>${currentChart.lunarDate}</div>
        <div class="info-item"><b>띠</b>${currentChart.zodiac||"-"}</div>
        <div class="info-item"><b>출생 시간</b>${currentChart.birthHour}</div>
      </div>
      ${currentChart.calculationNotes.map(x=>`<p class="hint">${x}</p>`).join("")}
    `;

    renderPillars(currentChart.pillars,currentChart.pillarAnalysis);
    renderDaewoon(currentChart.daewoon);
    renderSewoon(currentChart.sewoon);
    renderRelations(currentChart.relationAnalysis);

    $("chartSection").style.display="block";
    $("actionSection").style.display="block";
    $("resultSection").style.display="none";

    showStatus("사주 원국 계산이 완료되었습니다. 아래에서 원하는 AI 풀이를 선택하세요.");
    $("chartSection").scrollIntoView({behavior:"smooth",block:"start"});
  } catch(error) {
    showStatus(error.message || "사주 계산 중 오류가 발생했습니다.",true);
  } finally {
    $("calculateBtn").disabled=false;
    $("calculateBtn").textContent="사주 원국 확인하기";
  }
}

async function requestInterpretation(mode) {
  if (!currentChart) {
    showStatus("먼저 사주 원국을 확인해 주세요.",true,"aiStatus");
    return;
  }

  currentMode=mode;
  hideStatus("aiStatus");

  const buttons=document.querySelectorAll(".action-panel button");
  buttons.forEach(button=>button.disabled=true);
  showStatus("명리학 자료를 바탕으로 AI가 풀이를 작성하고 있습니다. 잠시 기다려 주세요.","","aiStatus");

  const modeNames={
    full:"종합 사주 분석",
    today:"오늘의 운세",
    wealth:"재물·직업운",
    love:"애정·결혼운",
    year2027:"2027년 운세"
  };

  try {
    const response=await fetch("/api/interpret",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        chart:currentChart,
        mode:mode
      })
    });

    const raw=await response.text();
    let data;

    try {
      data=JSON.parse(raw);
    } catch(e) {
      throw new Error("서버 응답을 읽을 수 없습니다. API 응답 형식을 확인해 주세요.");
    }

    if (!response.ok) {
      throw new Error(data.error || data.message || "AI 풀이 요청에 실패했습니다. ("+response.status+")");
    }

    const interpretation=data.interpretation || data.text || data.result;
    if (!interpretation) {
      throw new Error("AI 풀이 내용이 비어 있습니다. API 응답을 확인해 주세요.");
    }

    $("resultTitle").textContent=data.title || modeNames[mode];
    $("resultSubtitle").textContent=
      currentChart.name+" 님 · "+currentChart.solarDate+" · "+modeNames[mode];

    $("interpretation").textContent=interpretation;
    $("resultSection").style.display="block";
    $("aiStatus").style.display="none";

    $("resultSection").scrollIntoView({behavior:"smooth",block:"start"});
  } catch(error) {
    showStatus(error.message || "AI 풀이 중 오류가 발생했습니다.",true,"aiStatus");
  } finally {
    buttons.forEach(button=>button.disabled=false);
  }
}

function printReport() {
  if (!$("resultSection").style.display || $("resultSection").style.display==="none") {
    alert("먼저 AI 사주 풀이를 실행해 주세요.");
    return;
  }
  window.print();
}
